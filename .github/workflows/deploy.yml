# Reusable workflow: build an Eleventy site and deploy it to GitHub Pages.
#
# The calling workflow must grant `pages: write` and `id-token: write`.
name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      build-command:
        type: string
        default: npm run build
      output-dir:
        type: string
        default: _site

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: ${{ inputs.build-command }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.output-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
